name: Gated device build

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: Approved private build entry point
        required: true
        default: native-host
        type: choice
        options:
          - native-host
          - runtime-detour
          - runtime-detour-a2
          - private-access-a4
          - ios-assemblies
          - fna24-ios-native
          - vanilla-jit
          - everest-core
          - everest-metal

permissions:
  contents: read

concurrency:
  group: gated-private-device-build
  cancel-in-progress: false

jobs:
  build:
    name: Build private source
    runs-on: macos-26
    timeout-minutes: 120
    environment: private-build

    steps:
      - name: Restore public .NET iOS workload cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.dotnet/packs
            ~/.dotnet/sdk-manifests
            ~/.dotnet/metadata/workloads
          key: dotnet-ios-workload-${{ runner.os }}-${{ runner.arch }}-10.0.302.1-v1

      - name: Create short-lived repository token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.BUILD_APP_ID }}
          private-key: ${{ secrets.BUILD_APP_PRIVATE_KEY }}
          owner: ${{ secrets.PRIVATE_OWNER }}
          repositories: ${{ secrets.PRIVATE_REPOSITORY }}

      - name: Check out approved private source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ secrets.PRIVATE_OWNER }}/${{ secrets.PRIVATE_REPOSITORY }}
          ref: ${{ secrets.PRIVATE_REF }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          submodules: false
          fetch-depth: 1
          path: private-source

      - name: Restore public runtime detour dependency cache
        if: inputs.build_target == 'runtime-detour' || inputs.build_target == 'runtime-detour-a2' || inputs.build_target == 'private-access-a4'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            private-source/.cache/monomod-a2
            private-source/.cache/monomod-a3
          key: runtime-detour-${{ inputs.build_target }}-dfc30a1-${{ hashFiles('private-source/patches/monomod-dfc30a1506d37fb88a2c2be004f525205f46a24c-ios-a2.patch') }}

      - name: Run approved private build
        shell: bash
        working-directory: private-source
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_REPOSITORY: ${{ secrets.PRIVATE_OWNER }}/${{ secrets.PRIVATE_REPOSITORY }}
          INPUT_RELEASE: ${{ secrets.INPUT_RELEASE }}
          INPUT_ASSET: ${{ secrets.INPUT_ASSET }}
          OUTPUT_RELEASE: ${{ secrets.OUTPUT_RELEASE }}
        run: |
          case "${{ inputs.build_target }}" in
            native-host)
              bash ci/hosted-native-mono-host-build.sh
              ;;
            runtime-detour)
              bash ci/hosted-monomod-a3-build.sh
              ;;
            runtime-detour-a2)
              bash ci/hosted-monomod-a2-build.sh
              ;;
            private-access-a4)
              bash ci/hosted-private-access-a4-build.sh
              ;;
            ios-assemblies)
              bash ci/hosted-ios-assembly-preparation.sh
              ;;
            fna24-ios-native)
              bash ci/hosted-fna24-ios-native-build.sh
              ;;
            vanilla-jit)
              bash ci/hosted-vanilla-jit-build.sh
              ;;
            everest-core)
              bash ci/hosted-everest-core-build.sh
              ;;
            everest-metal)
              bash ci/hosted-everest-metal-build.sh
              ;;
            *)
              echo "Unsupported private build target." >&2
              exit 2
              ;;
          esac
